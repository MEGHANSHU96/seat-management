apiVersion: apps/v1
kind: Deployment
metadata:
  name: seat-management-api
  labels:
    app: seat-management-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: seat-management-api
  template:
    metadata:
      labels:
        app: seat-management-api
    spec:
      containers:
        - name: seat-api
          image: seat-management-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: seat-api-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
